name: build-frida-inject-barebone

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: Frida version tag to build (barebone-enabled frida-inject)
        required: true
        default: '17.19.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      FRIDA_PREFIX: /tmp/frida-dist
      FRIDA_VERSION: ${{ inputs.frida_version }}

    steps:
      - name: Check out frida monorepo (${{ inputs.frida_version }})
        run: |
          git clone --depth 1 --branch "$FRIDA_VERSION" https://github.com/frida/frida.git .
          git config --global --add safe.directory "$PWD"

      - name: Fetch submodules (releng + frida-core + frida-gum)
        run: |
          python tools/ensure-submodules.py frida-core frida-gum
          for p in subprojects/frida-core subprojects/frida-gum; do
            if [ -d "$p" ]; then
              (cd "$p" && git submodule update --init --depth 1 releng 2>/dev/null || true)
            fi
          done

      - name: Set up NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Set ANDROID_NDK_ROOT
        run: echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Configure (arm64 + barebone backend, inject tool)
        run: |
          ./configure \
            --prefix="$FRIDA_PREFIX" \
            --host=android-arm64 \
            --enable-inject \
            -- \
            -Dfrida-core:barebone_backend=enabled \
            -Dfrida-core:compiler_backend=disabled

      - name: Compile
        run: make 2>&1 | tail -100

      - name: Install
        run: make install

      - name: Collect linux-kmod.json (barebone device transport config)
        run: |
          find subprojects/frida-core -path '*barebone/agent/etc/linux-kmod*.json' -exec cp {} "$FRIDA_PREFIX/bin/" \;
          ls -la "$FRIDA_PREFIX/bin/"

      - name: Upload frida-inject + config
        uses: actions/upload-artifact@v4
        with:
          name: frida-inject-android-arm64-barebone-${{ inputs.frida_version }}
          path: |
            ${{ env.FRIDA_PREFIX }}/bin/frida-inject
            ${{ env.FRIDA_PREFIX }}/bin/linux-kmod*.json
          if-no-files-found: error
