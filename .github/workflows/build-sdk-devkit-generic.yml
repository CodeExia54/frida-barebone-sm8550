name: build-sdk-devkit-generic

# Full from-source pipeline for all 6 generic ddk KMI targets, entirely on
# GitHub's runners - local disk can't hold this (frida-core/frida-gum
# clones, Rust toolchains per KMI, cargo registries, docker layers all at
# once). Manual test build only, same as pvm-modules' own ddk.yml: nothing
# versioned or published, every artifact retention-days: 1.
#
#   build-sdk    -> soft-float SDK (picolibc + compiler-rt) from source,
#                   arch-only (arm64), not KMI-specific.
#   build-devkit -> GumJS devkit from source against that SDK, with this
#                   repo's own patch-gum-init.py / patch-gum-exception-
#                   null.py applied directly to frida-gum's gum.c - the
#                   root-cause fix, not a workaround. Also arch-only.
#   build-ko     -> frida-agent.ko, one matrix leg per KMI target
#                   (android12-5.10 .. android17-6.18), each in its own
#                   ghcr.io/ylarod/ddk:<kmi> container - the exact same
#                   container-per-matrix-leg pattern pvm-modules'
#                   .github/workflows/ddk.yml uses for its own modules.

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'frida-core/frida-gum tag to build'
        type: string
        default: '17.19.0'

jobs:
  build-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (clang-19, python, binutils, build deps)
        run: |
          set -e
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            wget curl git xz-utils ca-certificates python3 python3-pip \
            binutils-aarch64-linux-gnu \
            clang-19 libclang-19-dev lld-19 \
            gperf make gcc g++ pkg-config autoconf automake libtool cmake \
            flex bison texinfo
          python3 -m pip install --break-system-packages tomlkit
          clang-19 --version | head -1

      - name: Clone frida-core (${{ inputs.frida_version }}) + releng
        run: |
          set -e
          git clone --depth 1 --branch ${{ inputs.frida_version }} --recurse-submodules \
            https://github.com/frida/frida-core.git
          cd frida-core
          git submodule update --init --recursive --depth 1

      - name: Patch releng env_generic.py (arm64 BTI)
        run: |
          set -e
          python3 patch-bti-env.py frida-core/releng/env_generic.py
          grep -n "mbranch-protection" frida-core/releng/env_generic.py

      - name: Build soft-float SDK with BTI
        run: |
          set -eo pipefail
          export PATH="/usr/lib/llvm-19/bin:$PATH"
          export CC="clang-19 --target=aarch64-none-elf"
          export CXX="clang++-19 --target=aarch64-none-elf"
          cd frida-core
          python3 releng/deps.py build --bundle=sdk --host=none-arm64-softfloat 2>&1 | tail -100
          ls -la deps/*.tar.xz

      - name: Upload SDK bundle
        uses: actions/upload-artifact@v4
        with:
          name: sdk-none-arm64-softfloat
          path: frida-core/deps/sdk-none-arm64-softfloat.tar.xz
          if-no-files-found: error
          retention-days: 1

  build-devkit:
    needs: [build-sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (clang-19, python, binutils, build deps)
        run: |
          set -e
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            wget curl git xz-utils ca-certificates python3 python3-pip \
            binutils-aarch64-linux-gnu \
            clang-19 libclang-19-dev lld-19 \
            gperf make gcc g++ pkg-config autoconf automake libtool cmake \
            flex bison texinfo
          python3 -m pip install --break-system-packages tomlkit

      - name: Clone frida-gum (${{ inputs.frida_version }}) + releng
        run: |
          set -e
          git clone --depth 1 --branch ${{ inputs.frida_version }} --recurse-submodules \
            https://github.com/frida/frida-gum.git

      - name: Patch releng env_generic.py (arm64 BTI)
        run: |
          set -e
          python3 patch-bti-env.py frida-gum/releng/env_generic.py
          grep -n "mbranch-protection" frida-gum/releng/env_generic.py

      - name: Patch gum.c (call glib_init/gobject_init unconditionally)
        run: |
          set -e
          python3 patch-gum-init.py frida-gum/gum/gum.c
          grep -n "glib_init\|gobject_init" frida-gum/gum/gum.c | head

      - name: "Patch gumquickcore.c (NULL-guard strstr in exception handling)"
        run: |
          set -e
          python3 patch-gum-exception-null.py frida-gum/bindings/gumjs/gumquickcore.c
          # Verify the NULL guard is present, either as this patch's form
          # ("message != NULL &&") or the upstream 17.18.0+ form
          # ("if (message == NULL) return FALSE;").
          grep -nE "message != NULL|message == NULL" frida-gum/bindings/gumjs/gumquickcore.c

      - name: Patch gumarm64writer.c (BTI bypass via ret)
        run: |
          set -e
          python3 patch-gum-bti-ret.py frida-gum/gum/arch-arm64/gumarm64writer.c

      - name: Download SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-none-arm64-softfloat
          path: /tmp/sdk-artifact

      - name: Stage SDK tarball for gum configure
        run: |
          set -e
          mkdir -p frida-gum/deps
          cp /tmp/sdk-artifact/sdk-none-arm64-softfloat.tar.xz frida-gum/deps/

      - name: Configure GumJS devkit
        run: |
          set -eo pipefail
          export PATH="/usr/lib/llvm-19/bin:$PATH"
          export CC="clang-19 --target=aarch64-none-elf"
          export CXX="clang++-19 --target=aarch64-none-elf"
          cd frida-gum
          ./configure --host=none-arm64-softfloat --enable-gumjs \
            --with-devkits=gum,gumjs --with-devkit-symbol-scope=original 2>&1 | tail -60

      - name: Build GumJS devkit
        run: |
          set -eo pipefail
          export PATH="/usr/lib/llvm-19/bin:$PATH"
          cd frida-gum
          make 2>&1 | tail -80
          ls -la build/bindings/gumjs/devkit/

      - name: Upload GumJS devkit
        uses: actions/upload-artifact@v4
        with:
          name: gumjs-devkit-none-arm64-softfloat
          path: frida-gum/build/bindings/gumjs/devkit/
          if-no-files-found: error
          retention-days: 1

  build-ko:
    needs: [build-devkit]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18

    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-19 + Rust (aarch64-unknown-none + rust-src)
        run: |
          set -e
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            wget curl git xz-utils ca-certificates python3 python3-pip \
            binutils-aarch64-linux-gnu clang-19 libclang-19-dev lld-19
          python3 -m pip install --break-system-packages -q tomlkit
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable -q
          . "$HOME/.cargo/env"
          rustup target add aarch64-unknown-none
          rustup component add rust-src

      - name: Download SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-none-arm64-softfloat
          path: /tmp/sdk-artifact

      - name: Download GumJS devkit artifact
        uses: actions/download-artifact@v4
        with:
          name: gumjs-devkit-none-arm64-softfloat
          path: /tmp/gumjs-devkit

      - name: Clone frida-core (${{ inputs.frida_version }}) + releng
        run: |
          set -e
          git clone --depth 1 --branch ${{ inputs.frida_version }} https://github.com/frida/frida-core.git
          cd frida-core
          git submodule update --init --depth 1 releng

      - name: Patch frida-kmod.c (CFI fix + caches_clean_inval_pou via kallsyms)
        run: |
          set -e
          python3 patch-cfi.py frida-core/src/barebone/agent/linux/frida-kmod.c
          python3 patch-cache-flush-kallsyms.py frida-core/src/barebone/agent/linux/frida-kmod.c
          python3 patch-kmod-gki-compat.py frida-core/src/barebone/agent/linux/frida-kmod.c

      - name: Per-KMI ccflags (-Werror quirks + fs_struct lock detection)
        run: |
          KB=frida-core/src/barebone/agent/linux/Kbuild
          cat >> "$KB" <<'EOF'

          ccflags-y += -Wno-implicit-function-declaration
          ccflags-y += -Wno-missing-prototypes -Wno-missing-declarations
          EOF
          # fs_struct locking differs across GKI: 5.10-6.12 have `spinlock_t lock`
          # (use spin_lock(&fs->lock) via FRIDA_HAVE_FS_STRUCT_LOCK); 6.18 dropped
          # it back to a plain `seqlock_t seq` (use the read_seqlock_excl default).
          # Detect from the target kernel's own header rather than hardcode.
          FS=""
          for c in "/opt/ddk/src/${{ matrix.kmi }}/include/linux/fs_struct.h" \
                   "/opt/ddk/kdir/${{ matrix.kmi }}/include/linux/fs_struct.h"; do
            [ -f "$c" ] && { FS="$c"; break; }
          done
          echo "fs_struct.h: ${FS:-NOT FOUND}"
          if [ -n "$FS" ] && grep -qE 'spinlock_t[[:space:]]+lock;' "$FS"; then
            echo 'ccflags-y += -DFRIDA_HAVE_FS_STRUCT_LOCK' >> "$KB"
            echo "-> fs_struct has 'lock': FRIDA_HAVE_FS_STRUCT_LOCK enabled"
          else
            echo "-> fs_struct has no 'lock': using read_seqlock_excl(&fs->seq) default"
          fi

      - name: Extract SDK
        run: |
          set -e
          mkdir -p "$HOME/sdk-none-arm64-softfloat"
          tar -C "$HOME/sdk-none-arm64-softfloat" -xf /tmp/sdk-artifact/sdk-none-arm64-softfloat.tar.xz

      - name: Build frida-agent.ko
        run: |
          set -e
          . "$HOME/.cargo/env"
          export PATH="/opt/ddk/clang/"*"/bin:$PATH"
          unset CLANG_PATH
          export LIBCLANG_PATH=/usr/lib/llvm-19/lib

          SDK="$HOME/sdk-none-arm64-softfloat"
          # bindgen parses frida-gumjs.h with libclang and needs clang's own
          # builtin headers (stddef.h etc.) which the bare-metal --sysroot=$SDK
          # invocation does not add on its own (17.19.0's devkit header pulls in
          # <stddef.h>). Point bindgen at the compiler resource dir plus the SDK
          # includes the header also reaches for.
          export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(clang-19 -print-resource-dir)/include -isystem $SDK/include -I$SDK/include/glib-2.0 -I$SDK/lib/glib-2.0/include -I$SDK/include/capstone -I$SDK/include/json-glib-1.0 --sysroot=$SDK --target=aarch64-none-elf"
          export CC_AGENT="clang-19 --target=aarch64-none-elf -mabi=aapcs-soft \
            -mgeneral-regs-only -ffixed-x18 -fno-pic -mbranch-protection=bti --sysroot=$SDK \
            -isystem $SDK/include -I $SDK/include/glib-2.0 -I $SDK/lib/glib-2.0/include \
            -I $SDK/include/capstone -I $SDK/include/json-glib-1.0"

          cd frida-core/src/barebone/agent/linux
          make ARCH=arm64 FRIDA_SDK="$SDK" GUMJS_DEVKIT_DIR="/tmp/gumjs-devkit" \
            AGENT_RUSTFLAGS="-Zfixed-x18 -Zbranch-protection=bti" \
            AGENT_LD=aarch64-linux-gnu-ld AGENT_AR=aarch64-linux-gnu-ar \
            AGENT_NM=aarch64-linux-gnu-nm AGENT_OBJCOPY=aarch64-linux-gnu-objcopy \
            CC_aarch64_unknown_none="$CC_AGENT" KDIR="$KDIR" LLVM=1
          ls -la frida-agent.ko

      - name: Strip SHF_RO_AFTER_INIT from .bss
        run: |
          set -e
          python3 strip-bss-roafter.py frida-core/src/barebone/agent/linux/frida-agent.ko

      - name: Rename + strip debug (pvm-modules' own ddk.yml naming convention)
        run: |
          set -e
          mkdir -p out
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          KMI_NAME="${{ matrix.kmi }}"
          KMI_NAME="${KMI_NAME//-/_}"
          OUTPUT_NAME="frida-agent_${KMI_NAME}_${TIMESTAMP}.ko"
          cp frida-core/src/barebone/agent/linux/frida-agent.ko "out/$OUTPUT_NAME"
          llvm-strip -d "out/$OUTPUT_NAME"
          modinfo "out/$OUTPUT_NAME"
          echo "OUTPUT_NAME=$OUTPUT_NAME" >> "$GITHUB_ENV"

      - name: Upload frida-agent.ko
        uses: actions/upload-artifact@v4
        with:
          name: frida-agent-${{ matrix.kmi }}
          path: out/${{ env.OUTPUT_NAME }}
          retention-days: 1
          if-no-files-found: error
